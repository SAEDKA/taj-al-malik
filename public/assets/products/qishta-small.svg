    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDD39C"/>
      <stop offset="50%" stop-color="#C6A365"/>
      <stop offset="100%" stop-color="#9A7432"/>
    </linearGradient>
    <linearGradient id="kataifiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C76B"/>
      <stop offset="50%" stop-color="#D99B38"/>
      <stop offset="100%" stop-color="#A86B14"/>
    </linearGradient>
    <linearGradient id="pistachioGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#98C948"/>
      <stop offset="55%" stop-color="#6CA329"/>
      <stop offset="100%" stop-color="#467314"/>
    </linearGradient>
    <linearGradient id="qishtaCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF9EC"/>
      <stop offset="100%" stop-color="#EFE2C8"/>
    </linearGradient>
    <linearGradient id="walnutBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C48845"/>
      <stop offset="50%" stop-color="#8F5922"/>
      <stop offset="100%" stop-color="#5E350E"/>
    </linearGradient>
    <linearGradient id="chocoRich" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A311D"/>
      <stop offset="50%" stop-color="#3B1D0F"/>
      <stop offset="100%" stop-color="#241007"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2B070A" flood-opacity="0.22"/>
    </filter>
    <filter id="pieceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2B070A" flood-opacity="0.24"/>
    </filter>
