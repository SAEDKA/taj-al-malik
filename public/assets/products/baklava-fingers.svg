    <ellipse cx="400" cy="336" rx="273" ry="204" fill="#4A0E13" opacity="0.18"/>
    <ellipse cx="400" cy="336" rx="266" ry="198" fill="#FFFDF9" stroke="#C6A365" stroke-width="3"/>
