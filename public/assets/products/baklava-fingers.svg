    <linearGradient id="walnutBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C48845"/>
      <stop offset="50%" stop-color="#8F5922"/>
      <stop offset="100%" stop-color="#5E350E"/>
    </linearGradient>
    <linearGradient id="chocoRich" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A311D"/>
      <stop offset="50%" stop-color="#3B1D0F"/>
      <stop offset="100%" stop-color="#241007"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2B070A" flood-opacity="0.22"/>
    </filter>
    <filter id="pieceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2B070A" flood-opacity="0.24"/>
    </filter>
