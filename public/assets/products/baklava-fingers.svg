      <ellipse cx="60" cy="0" rx="12" ry="4" fill="url(#pistachioGreen)"/>
      <ellipse cx="0" cy="0" rx="12" ry="4" fill="url(#pistachioGreen)"/>
    </g>

    <g transform="translate(400,422)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="url(#kataifiGold)" stroke="#F6D588" stroke-width="1.5"/>
      <line x1="-50" y1="-14" x2="-50" y2="14" stroke="#9E5E10" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#9E5E10" stroke-width="2"/>
      <line x1="50" y1="-14" x2="50" y2="14" stroke="#9E5E10" stroke-width="2"/>
      <ellipse cx="-95" cy="0" rx="6" ry="12" fill="url(#pistachioGreen)"/>
      <ellipse cx="95" cy="0" rx="6" ry="12" fill="url(#pistachioGreen)"/>
      <ellipse cx="-60" cy="0" rx="12" ry="4" fill="url(#pistachioGreen)"/>
