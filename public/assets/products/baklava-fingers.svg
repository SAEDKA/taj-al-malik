  <!-- Studio Backdrop -->
  <rect width="800" height="640" fill="url(#bgGrad)"/>

  <!-- Subtle Oriental Arch & Geometric Border -->
  <g opacity="0.16" stroke="url(#goldRim)" stroke-width="1.5" fill="none">
    <rect x="24" y="24" width="752" height="592" rx="22"/>
    <rect x="34" y="34" width="732" height="572" rx="16"/>
    <path d="M24 90 L90 24 M776 90 L710 24 M24 550 L90 616 M776 550 L710 616"/>
  </g>

  <!-- Royal Serving Platter -->
